[package]
name = "taska"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ta"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"
fd-lock = "4.0"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
