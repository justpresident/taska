[package]
name = "taska"
version = "0.3.0"
edition = "2021"
authors = ["Roman Studenikin <justpresident@gmail.com>"]
description = "Local-first, git-native task & dependency tracker for humans and agents"
repository = "https://github.com/justpresident/taska"
homepage = "https://github.com/justpresident/taska"
license = "Apache-2.0"
readme = "README.md"
keywords = ["task", "todo", "agentic", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published tarball to the crate itself; internal/draft docs stay in the repo.
exclude = ["/docs"]

[lib]
name = "taska"
path = "src/lib.rs"

[[bin]]
name = "ta"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# Comment-preserving TOML editing for `ta config set`.
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.8"
# Per-field regex matching for `ta search`.
regex = "1"
fd-lock = "4.0"
clap = { version = "4.4", features = ["derive"] }

# Unix-only: reset SIGPIPE to default in `main` so `ta … | head` terminates
# cleanly instead of panicking in the print macros (which ignore SIGPIPE).
# Already in the dependency tree transitively; this only makes it direct.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
