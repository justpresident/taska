[package]
name = "taska"
version = "1.1.0"
edition = "2021"
authors = ["Roman Studenikin <justpresident@gmail.com>"]
description = "Local-first, git-native task & dependency tracker for humans and ai agents"
repository = "https://github.com/justpresident/taska"
homepage = "https://github.com/justpresident/taska"
license = "Apache-2.0"
readme = "README.md"
keywords = ["task", "todo", "agentic", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Ship the code, its tests/benches, and the user-facing docs - nothing else.
# Excluded: /docs (drafts), the dogfood task store, the tutorial walkthroughs, CI
# config, the agent guide, and the installer script - all dev/repo material a
# crate consumer doesn't need.
exclude = ["/docs", "/.taska", "/tutorials", "/.github", "/CLAUDE.md", "/scripts"]

# Release builds (and the binaries the release workflow ships) are size- and
# speed-optimized: fat LTO needs codegen-units = 1 to inline across the whole
# crate graph, and symbols are stripped. Dev builds and `cargo test` use the
# dev/test profiles and are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lib]
name = "taska"
path = "src/lib.rs"

[[bin]]
name = "ta"
path = "src/main.rs"

# No-dependency perf harness (plain `main()`, std timing - no criterion).
[[bench]]
name = "perf"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
# Comment-preserving TOML editing for `ta config set`.
toml_edit = "0.25.12"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.8"
# Per-field `~` regex criteria in `ta list`, and schema `pattern` constraints.
regex = "1"
fd-lock = "4.0"
clap = { version = "4.4", features = ["derive"] }
# `ta completions <shell>` scripts + dynamic (store-aware) completion of task ids,
# columns, and filter fields. The dynamic engine is behind `unstable-dynamic`.
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
# `ta self-update`: download the latest GitHub-release `.tar.gz` and replace the
# running binary in place. ureq + rustls is the light, OpenSSL-free HTTP backend;
# compression-flate2 (pulls archive-tar) unpacks the release `.tar.gz` assets.
self_update = { version = "0.44", default-features = false, features = ["ureq", "rustls", "compression-flate2"] }

# Unix-only: reset SIGPIPE to default in `main` so `ta ... | head` terminates
# cleanly instead of panicking in the print macros (which ignore SIGPIPE).
# Already in the dependency tree transitively; this only makes it direct.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Bench-only: the perf harness compares Vec vs SmallVec for the per-task
# blocker-edge lists. Not used by the library/binary, so it never ships.
[dev-dependencies]
smallvec = "1"
