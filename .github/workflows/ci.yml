name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test & Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Classic Mercurial (not on the runner image by default) so the hg
      # merge-tool e2e theme (tests/mercurial.rs) actually runs instead of
      # self-skipping. Its gate keys off the "Mercurial Distributed SCM" banner,
      # which the apt `mercurial` package's `hg` reports.
      - name: Install Mercurial
        run: sudo apt-get update && sudo apt-get install -y mercurial

      - name: Run tests
        run: cargo test --all --all-features

      - name: Run clippy
        run: |
          cargo clippy --all --all-features -- \
            -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Mercurial too, so the hg merge-tool paths are exercised (and covered)
      # rather than skipped during the coverage run.
      - name: Install Mercurial
        run: sudo apt-get update && sudo apt-get install -y mercurial

      # cargo-llvm-cov merges the per-process .profraw files (the e2e suite spawns
      # the `ta` binary ~2000 times) via `llvm-profdata merge --sparse` - the C++
      # tool, streaming and memory-light - instead of tarpaulin's in-Rust merge,
      # which OOM'd on that many files. Same cobertura output for the badge below.
      - name: Generate coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex '(^|/)tests/' \
            --cobertura --output-path coverage/cobertura.xml

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1 | awk '{printf "%.1f", $1 * 100}')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

          # Determine badge color
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Create coverage badge
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir -p .github/badges
          curl -s "https://img.shields.io/badge/coverage-${{ steps.coverage.outputs.percentage }}%25-${{ steps.coverage.outputs.color }}" > .github/badges/coverage.svg

      - name: Commit badge
        if: github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git pull --rebase
          git push
